<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <title>Kalyan Babu | Senior Mobile Application Developer</title>
  <meta name="description" content="Senior Mobile Application Developer with 5+ years of experience engineering high-performance production Flutter, Android & iOS systems across Enterprise ERP, GIS spatial analytics, and offline-first field operations.">
  <meta name="keywords" content="Kalyan Babu, Senior Mobile Developer, Flutter Developer, Android Developer, iOS Developer, ERP Mobile, GIS, Offline Sync, BLoC, GetX, Hyderabad">
  <meta name="author" content="Kalyan Babu">
  <meta name="theme-color" content="#0B0F19">

  <!-- Open Graph / LinkedIn / Facebook Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kalyan Babu | Senior Mobile Application Developer">
  <meta property="og:description" content="5+ years experience building production Flutter, Android & iOS apps across enterprise ERP, GIS spatial analytics, and offline field operations.">
  <meta property="og:site_name" content="Kalyan Babu Portfolio">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kalyan Babu | Senior Mobile Application Developer">
  <meta name="twitter:description" content="5+ years experience building production Flutter, Android & iOS apps across enterprise ERP, GIS spatial analytics, and offline field operations.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kalyan Babu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Pre-loader styles for instant visual wow on web load -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B0F19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #F8FAFC;
      overflow-x: hidden;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111827 0%, #0B0F19 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .monogram-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #00D2FF 0%, #3A7BD5 50%, #8B5CF6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      color: #FFFFFF;
      box-shadow: 0 10px 30px rgba(0, 210, 255, 0.35);
      animation: pulse 2s infinite ease-in-out;
    }
    .loading-title {
      margin-top: 24px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #F8FAFC;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #94A3B8;
    }
    .spinner-ring {
      margin-top: 20px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00D2FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(0, 210, 255, 0.35); }
      50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(0, 210, 255, 0.55); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Instant Preloader while Flutter Web WASM/JS engine initializes -->
  <div id="loading-container">
    <div class="monogram-badge">KB</div>
    <div class="loading-title">Kalyan Babu</div>
    <div class="loading-sub">Senior Mobile Application Developer</div>
    <div class="spinner-ring"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
